
name: Build private APK

'on':
  workflow_dispatch:
  push:
    branches:
      - feature/drive-safe-v03

permissions:
  contents: read

jobs:
  build:
    name: Build DriveMate AI APK
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Locate Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"

      - name: Verify Android SDK
        shell: bash
        run: |
          echo "Android SDK: ${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls -la "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -maxdepth 4 -type f -name sdkmanager

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.4'

      - name: Build debug APK
        shell: bash
        run: |
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DriveMateAI-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
